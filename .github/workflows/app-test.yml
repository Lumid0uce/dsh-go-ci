# Runs the app test suite on a full checkout: the local Windows tree is a sparse
# checkout without assets/, so `flutter test` cannot bundle assets there.
# The suite needs the CJK test fonts (via DSH_TEST_FONT_DIR) and fish/zsh for the
# ssh completion tests, exactly like upstream ci.yml.
name: app-test

on:
  workflow_dispatch:
  push:
    branches: [feat/phone-agent-claude-codex]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: test deps (fonts, fish, zsh)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji fish zsh
          # test/support/test_fonts.dart wants Regular/Bold/Light here ...
          test -f "$DSH_TEST_FONT_DIR/NotoSansCJK-Regular.ttc"
          test -f "$DSH_TEST_FONT_DIR/NotoSansCJK-Bold.ttc"
          test -f "$DSH_TEST_FONT_DIR/NotoSansCJK-Light.ttc"
          # ... and test/drawer/support.dart hard-codes the emoji font here.
          sudo install -Dm644 /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
          ls "$DSH_TEST_FONT_DIR" | head

      - name: pub get
        working-directory: app
        run: |
          sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock
          flutter pub get

      - name: flutter test
        working-directory: app
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=4 --reporter compact 2>&1 | tee /tmp/app_test.log

      - name: tail on failure
        if: failure()
        run: grep -E "Failed to load|\[E\]|Some tests failed|Error:" /tmp/app_test.log | head -120 || true
